name: Build Ashwini Khata APK

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  # Allow manual trigger from GitHub UI
  workflow_dispatch:

jobs:
  build:
    name: Build Release APK
    runs-on: ubuntu-latest

    steps:
      # ── 1. Checkout code ────────────────────────────────────────────────
      - name: Checkout Repository
        uses: actions/checkout@v4

      # ── 2. Setup Java ───────────────────────────────────────────────────
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # ── 3. Setup Flutter ────────────────────────────────────────────────
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0'
          channel: 'stable'
          cache: true

      # ── 4. Verify Flutter installation ──────────────────────────────────
      - name: Flutter Version
        run: flutter --version

      # ── 5. Get dependencies ─────────────────────────────────────────────
      - name: Get Flutter Dependencies
        run: flutter pub get

      # ── 6. Analyze code (non-blocking) ──────────────────────────────────
      - name: Analyze Code
        run: flutter analyze --no-fatal-infos || true

      # ── 7. Run tests (if any) ────────────────────────────────────────────
      - name: Run Tests
        run: flutter test || true

      # ── 8. Build release APK ────────────────────────────────────────────
      - name: Build Release APK
        run: |
          flutter build apk \
            --release \
            --no-shrink \
            --build-name=1.0.0 \
            --build-number=${{ github.run_number }}

      # ── 9. Rename APK with version info ─────────────────────────────────
      - name: Rename APK
        run: |
          mkdir -p output
          cp build/app/outputs/flutter-apk/app-release.apk \
             output/AshwiniKhata-v1.0.0-build${{ github.run_number }}.apk
          echo "APK built successfully!"
          ls -lh output/

      # ── 10. Upload APK as artifact ───────────────────────────────────────
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AshwiniKhata-APK-build${{ github.run_number }}
          path: output/AshwiniKhata-v1.0.0-build${{ github.run_number }}.apk
          retention-days: 30

      # ── 11. Create GitHub Release on version tags ────────────────────────
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v1
        with:
          files: output/AshwiniKhata-v1.0.0-build${{ github.run_number }}.apk
          name: अश्विनी खाता ${{ github.ref_name }}
          body: |
            ## अश्विनी खाता ${{ github.ref_name }}

            ### नवीन अपडेट
            - हा अपडेट स्वयंचलितपणे तयार झाला आहे

            ### APK डाउनलोड
            खाली APK फाइल डाउनलोड करा आणि आपल्या फोनवर इन्स्टॉल करा.

            ### इन्स्टॉल करण्यासाठी
            1. APK डाउनलोड करा
            2. फोनमध्ये "Unknown Sources" परवानगी द्या
            3. APK उघडा आणि Install करा
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
